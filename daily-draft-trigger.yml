name: Daily draft trigger

on:
  schedule:
    # 14:00 UTC daily. Adjust to whenever suits your customers' timezone.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily draft generation endpoint
        run: |
          curl -sf -X POST "https://trendit-4ocu.onrender.com/internal/generate-drafts" \
            -H "x-internal-token: ${{ secrets.INTERNAL_TOKEN }}" \
            -o response.json -w "HTTP %{http_code}\n"
          cat response.json
